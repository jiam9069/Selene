name: Build Selene

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  # 质量门禁：源码 analyze/test 不绿就不构建（原先只有构建，测试全靠本地）。
  # 测试跑在源码仓库默认分支上；E2E（moontvplus_e2e_test.dart）无
  # MOONTVPLUS_E2E=1 环境变量时自动跳过，不依赖真实后端。
  test:
    runs-on: ubuntu-latest
    name: Analyze & Test

    steps:
      - name: Clone source repository
        env:
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_TOKEN: ${{ secrets.PULL_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${SOURCE_REPO:-jiam9069/Selene-Source}"
          if [ -n "${SOURCE_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${SOURCE_TOKEN}@github.com/${REPO}.git" .
          else
            git clone --depth 1 "https://github.com/${REPO}.git" .
          fi
          echo "已克隆源码仓库: ${REPO}"
        shell: bash

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Run shell tests
        run: |
          chmod +x test/*.sh
          bash test/ci_config_test.sh
          bash test/build_sh_parallel_failure_test.sh
        shell: bash

      - name: flutter pub get
        run: flutter pub get
        shell: bash

      - name: dart analyze
        # 用 dart analyze 而非 flutter analyze：后者走 LSP，在含 CJK 的路径下
        # 会因帧长度错位必现崩溃；dart analyze 同一套诊断，warning 致命、info 不致命。
        run: dart analyze
        shell: bash

      - name: flutter test
        run: flutter test
        shell: bash

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
            build-args: "--android-only"

          - name: macos_ios
            os: macos-latest
            build-args: "--apple-only --sequential"

          - name: windows-amd64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    env:
      NDK_VERSION: '29.0.14033849'
      NDK_VERSION_DEPS: '27.0.12077973'

    name: Build ${{ matrix.name }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Clone source repository
        # 源码仓库（Selene-Source 的 fork）与发布仓库分离：
        # 本仓库只负责构建与发布，Flutter 源码在 SOURCE_REPO 中。
        # 默认指向适配 MoonTVPlus 的 fork；如需更换，设置仓库变量 SOURCE_REPO 即可。
        # 该仓库是公开的，因此无需任何 secret 也能构建（私有仓库再配 PULL_TOKEN）。
        env:
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_TOKEN: ${{ secrets.PULL_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${SOURCE_REPO:-jiam9069/Selene-Source}"
          if [ -n "${SOURCE_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${SOURCE_TOKEN}@github.com/${REPO}.git" .
          else
            git clone --depth 1 "https://github.com/${REPO}.git" .
          fi
          echo "已克隆源码仓库: ${REPO}"
        shell: bash

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            VERSION=$(powershell -Command "(Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object {\$_ -replace 'version: ', ''}).trim()")
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          fi
          VERSION=$(echo "$VERSION" | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
        shell: bash

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Disable Swift Package Manager for Apple builds
        if: matrix.name == 'macos_ios'
        run: |
          flutter config --no-enable-swift-package-manager
        shell: bash

      - name: Install Java
        if: matrix.name == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        if: matrix.name == 'android'
        # 原先用 android-actions/setup-android@v3，该 action 会执行
        # `sdkmanager tools`，而新版 cmdline-tools 已不再提供 `tools` 包，
        # 导致 "Failed to find package 'tools'" 并使 Android 构建必然失败。
        # ubuntu runner 自带 Android SDK 与 cmdline-tools，这里直接复用它。
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::未找到 Android SDK: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager（cmdline-tools 缺失）"
            exit 1
          fi
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"

          # 预先接受许可，避免后续安装 NDK 时卡在交互提示
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --version
          echo "Android SDK 就绪: $SDK_ROOT"
        shell: bash

      - name: Cache Gradle
        if: matrix.name == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK
        if: matrix.name == 'android'
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION_DEPS }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}-${{ env.NDK_VERSION_DEPS }}

      - name: Install NDK
        if: matrix.name == 'android' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "y" | sdkmanager --install "ndk;${{ env.NDK_VERSION_DEPS }}"

      - name: Write sign info
        if: matrix.name == 'android'
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Writing signing configuration..."
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/key.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          storeFile=${{ github.workspace }}/key.jks
          EOF
            echo "Signing configuration written successfully"
          else
            echo "WARNING: SIGNING_KEY secret is not set!"
          fi
        shell: bash

      - name: Build with build.sh (Android/macOS/iOS)
        if: matrix.name != 'windows-amd64'
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.build-args }}
        shell: bash

      - name: Build on Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.get_version.outputs.version }}"
          Write-Host "Building version: $version" -ForegroundColor Green

          flutter pub get

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Write-Host "Building Windows..." -ForegroundColor Blue
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $releasePath = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releasePath)) {
            throw "Windows release directory not found: $releasePath"
          }

          Compress-Archive `
            -Path "$releasePath/*" `
            -DestinationPath "dist/selene-$version-windows-x64-portable.zip" `
            -Force

          Write-Host "Windows build complete" -ForegroundColor Green

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release-artifacts
          path: dist/*
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;

          if [ -z "$(find release-files -type f -print -quit)" ]; then
            echo "No release artifacts found"
            exit 1
          fi

          ls -lh release-files/

      - name: Get version from tag
        id: tag_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.version }}
          name: Selene ${{ steps.tag_version.outputs.version }}
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Release Notes
        id: release_notes
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.tag_version.outputs.version }}")

          RELEASE_BODY=$(echo "$RELEASE_INFO" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('body', '') if 'body' in data else '')")

          {
            echo 'notes<<EOF'
            echo "$RELEASE_BODY"
            echo EOF
          } >> $GITHUB_OUTPUT

          echo "Release notes length: ${#RELEASE_BODY}"

  cleanup:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
